# Builds Riptide for Windows, macOS and Linux. A pushed v* tag also publishes the builds as a
# GitHub release; running it by hand only builds them (see the run's artifacts).
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, name: windows-x64 }
          # The oldest supported Ubuntu, so the binary runs on older glibc too.
          - { os: ubuntu-22.04, name: linux-x64 }
          - { os: macos-latest, name: macos-universal }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config cmake libclang-dev libasound2-dev libpulse-dev \
            libdbus-1-dev libxkbcommon-dev libwayland-dev libgl1-mesa-dev

      - name: Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cargo build --release
          New-Item -ItemType Directory dist/Riptide | Out-Null
          Copy-Item target/release/riptide.exe, README.md, LICENSE dist/Riptide
          Compress-Archive dist/Riptide dist/riptide-${{ matrix.name }}.zip

      - name: Linux
        if: runner.os == 'Linux'
        run: |
          cargo build --release
          mkdir -p dist/riptide
          cp target/release/riptide README.md LICENSE assets/riptide.png dist/riptide/
          tar -C dist -czf dist/riptide-${{ matrix.name }}.tar.gz riptide

      # One app for Apple silicon and Intel Macs. Unsigned, so it gets an ad-hoc signature, which
      # Apple silicon needs before it will open the app at all.
      - name: macOS
        if: runner.os == 'macOS'
        run: |
          cargo build --release --target aarch64-apple-darwin
          cargo build --release --target x86_64-apple-darwin
          app=dist/Riptide.app
          mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources"
          lipo -create target/aarch64-apple-darwin/release/riptide target/x86_64-apple-darwin/release/riptide \
            -output "$app/Contents/MacOS/riptide"
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          sed "s/__VERSION__/$version/g" packaging/macos/Info.plist > "$app/Contents/Info.plist"
          iconset="$RUNNER_TEMP/riptide.iconset"
          mkdir -p "$iconset"
          for size in 16 32 128 256 512; do
            sips -z $size $size assets/riptide.png --out "$iconset/icon_${size}x${size}.png" >/dev/null
            sips -z $((size * 2)) $((size * 2)) assets/riptide.png --out "$iconset/icon_${size}x${size}@2x.png" >/dev/null
          done
          iconutil -c icns "$iconset" -o "$app/Contents/Resources/riptide.icns"
          codesign --force --sign - "$app"
          ditto -c -k --keepParent "$app" dist/riptide-${{ matrix.name }}.zip

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: dist/riptide-*
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
